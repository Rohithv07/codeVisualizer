name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install C++ and LLDB dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lldb python3-lldb

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven Unit Tests
        run: ./mvnw -f backend/pom.xml test

      - name: Build Application Jar
        run: ./mvnw -f backend/pom.xml package -DskipTests
